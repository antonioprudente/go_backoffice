<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista Utenti</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }

        th {
            background-color: #f4f4f4;
        }

        .error {
            color: red;
        }
    </style>
</head>

<body>
    <h1>Lista utenti</h1>

    <div id="error-message" class="error"></div>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Ruolo</th>
                <th>Nome</th>
                <th>Cognome</th>
                <th>Username</th>
                <th>Email</th>
                <th>Stato</th>
            </tr>
        </thead>
        <tbody id="users-table-body">
        </tbody>
    </table>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            fetchUsers();
        });

        function fetchUsers() {
            // Modifica l'URL se la tua rotta backend Go è su una porta/path differente
            fetch('http://127.0.0.1:9090/users')
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Errore nella risposta della rete');
                    }
                    return response.json();
                })
                .then(users => {
                    const tbody = document.getElementById('users-table-body');
                    tbody.innerHTML = '';

                    users.forEach(user => {
                        const row = document.createElement('tr');
                        row.innerHTML = `
                            <td>${user.id ?? ''}</td>
                            <td>${user.role ?? ''}</td>
                            <td>${user.first_name ?? ''}</td>
                            <td>${user.last_name ?? ''}</td>
                            <td>${user.username ?? ''}</td>
                            <td>${user.email ?? ''}</td>
                            <td>${user.status ?? ''}</td>
                        `;
                        tbody.appendChild(row);
                    });
                })
                .catch(error => {
                    console.error('Errore durante la richiesta AJAX:', error);
                    document.getElementById('error-message').textContent = 'Impossibile caricare gli utenti.';
                });
        }
    </script>
</body>

</html>
